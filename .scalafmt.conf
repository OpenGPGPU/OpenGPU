version = "3.11.5"
runner.dialect = scala213
maxColumn = 120
# Allow enough layout search for long ChiselEnum declarations and Chisel calls.
runner.maxStateVisits = 5000000
runner.optimizer.maxVisitsPerToken = 500000

fileOverride {
  ".sbt" = sbt1
  "glob:**/src/main/scala/opengpu/system/ComputeResourceCapabilities.scala" {
    newlines.source = unfold
  }
}

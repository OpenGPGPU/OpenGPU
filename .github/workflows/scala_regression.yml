name: Scala regression
run-name: Scala regression (${{ inputs.scope || 'full' }})

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Regression catalog to execute
        type: choice
        options: [full, graphics]
        default: full
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: scala-regression-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  driver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Run host script tests
      run: bash scripts/test_scripts.sh

  # Run the complete catalog, unless this exact nightly revision already passed.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      batch1: ${{ steps.partitions.outputs.batch1 }}
      batch2: ${{ steps.partitions.outputs.batch2 }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
        submodules: recursive
    - name: Select full regression
      id: select
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        SELECTED=ALL
        if [ "$EVENT_NAME" = schedule ]; then
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/scala_regression.yml/runs?status=success&event=schedule&per_page=20" --jq '.workflow_runs[].head_sha')
          if printf '%s\n' "$PREVIOUS" | grep -Fxq "$GITHUB_SHA"; then
            SELECTED=NONE
          fi
        fi
        echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
        python3 scripts/ci_case_partitions.py graph "$SELECTED" --scope "${{ inputs.scope || 'full' }}" > "$RUNNER_TEMP/selection.json"
        python3 scripts/ci_case_partitions.py candidates "$RUNNER_TEMP/selection.json" > "$RUNNER_TEMP/case-suites.txt"
    - name: Set up JDK 11
      if: steps.select.outputs.selected != 'NONE'
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: temurin
        cache: sbt
    - name: Set up sbt
      if: steps.select.outputs.selected != 'NONE'
      uses: sbt/setup-sbt@v1
    - name: Cache incremental Scala compilation
      if: steps.select.outputs.selected != 'NONE'
      uses: actions/cache@v4
      with:
        path: |
          target/scala-2.13
          project/target
        key: sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-
    - name: Discover registered cases without executing test bodies
      if: steps.select.outputs.selected != 'NONE'
      run: |
        if [ -s "$RUNNER_TEMP/case-suites.txt" ]; then
          CASE_SUITES=$(tr '\n' ' ' < "$RUNNER_TEMP/case-suites.txt")
          sbt "Test / runMain opengpu.testutil.CiSuiteCases $RUNNER_TEMP/cases.tsv $CASE_SUITES"
        fi
    - name: Plan complete regression partitions
      id: partitions
      run: |
        touch "$RUNNER_TEMP/cases.tsv"
        BATCHES=$(python3 scripts/ci_case_partitions.py regression-batches "$RUNNER_TEMP/selection.json" "$RUNNER_TEMP/cases.tsv")
        BATCH1=$(printf '%s' "$BATCHES" | jq -c '.[0]')
        BATCH2=$(printf '%s' "$BATCHES" | jq -c '.[1]')
        echo "batch1=$BATCH1" >> "$GITHUB_OUTPUT"
        echo "batch2=$BATCH2" >> "$GITHUB_OUTPUT"
        printf 'Regression scope: %s\n\nMatrix sizes: %s and %s\n' "${{ inputs.scope || 'full' }}" "$(printf '%s' "$BATCH1" | jq 'length')" "$(printf '%s' "$BATCH2" | jq 'length')" >> "$GITHUB_STEP_SUMMARY"

  scala:
    name: scala (${{ matrix.partition.id }})
    needs: [select]
    if: needs.select.outputs.selected != 'NONE'
    strategy:
      fail-fast: false
      # Reserve nine slots for PR tests and two for nightly setup jobs.
      max-parallel: 9
      matrix:
        partition: ${{ fromJson(needs.select.outputs.batch1) }}

    # Distro Verilator on 24.04 is 5.020 (too old) and on 26.04 is 5.032
    # (internal fault on GraphicsAddressTranslator). Pin v5.050 from source.
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      # Leave room for firtool and Verilator instead of committing 6 GB before
      # the first model build. The JVM can still grow to the same 6 GB ceiling.
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        submodules: recursive
    - name: Set up simulation toolchain
      id: toolchain
      uses: ./.github/actions/setup-simulation
    - name: Cache incremental Scala compilation
      uses: actions/cache@v4
      with:
        path: |
          target/scala-2.13
          project/target
        key: sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-
    - name: Prepare simulation cache directory
      run: mkdir -p target/chiselsim
    - name: Cache compiled simulation models
      id: simcache
      # Models are content-addressed. Roll the outer cache key so a cache hit
      # can still save new models; never archive per-run simulation workdirs.
      uses: actions/cache@v4
      with:
        path: target/chiselsim/cache
        key: simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-${{ matrix.partition.cache }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition.id }}
        restore-keys: |
          simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-${{ matrix.partition.cache }}-
    - name: Run partition ${{ matrix.partition.id }}
      env:
        SUITES_JSON: ${{ toJson(matrix.partition.suites) }}
        CASES_JSON: ${{ toJson(matrix.partition.cases) }}
        SHARD: ${{ matrix.partition.shard }}
        CI_TEST_LOG: ${{ runner.temp }}/regression-tests.log
      run: |
        # Serial JVM and one compiler for graphics; matrix jobs run in parallel.
        case "$SHARD" in
          graphics-*|system-host|core-b|system-rt-16|system-rt-32|system-rt-batch)
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            ;;
        esac
        SBT_FLAGS=$(bash scripts/ci_shard_tests.sh flags "$SHARD")
        export SBT_FLAGS
        python3 scripts/run_ci_partition.py

  scala-overflow:
    name: scala-overflow (${{ matrix.partition.id }})
    needs: [select, scala]
    if: always() && needs.select.result == 'success' && needs.select.outputs.batch2 != '[]'
    strategy:
      fail-fast: false
      # Reserve nine slots for PR tests and two for nightly setup jobs.
      max-parallel: 9
      matrix:
        partition: ${{ fromJson(needs.select.outputs.batch2) }}

    # Distro Verilator on 24.04 is 5.020 (too old) and on 26.04 is 5.032
    # (internal fault on GraphicsAddressTranslator). Pin v5.050 from source.
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      # Leave room for firtool and Verilator instead of committing 6 GB before
      # the first model build. The JVM can still grow to the same 6 GB ceiling.
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        submodules: recursive
    - name: Set up simulation toolchain
      id: toolchain
      uses: ./.github/actions/setup-simulation
    - name: Cache incremental Scala compilation
      uses: actions/cache@v4
      with:
        path: |
          target/scala-2.13
          project/target
        key: sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-
    - name: Prepare simulation cache directory
      run: mkdir -p target/chiselsim
    - name: Cache compiled simulation models
      id: simcache
      # Models are content-addressed. Roll the outer cache key so a cache hit
      # can still save new models; never archive per-run simulation workdirs.
      uses: actions/cache@v4
      with:
        path: target/chiselsim/cache
        key: simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-${{ matrix.partition.cache }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition.id }}
        restore-keys: |
          simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-${{ matrix.partition.cache }}-
    - name: Run partition ${{ matrix.partition.id }}
      env:
        SUITES_JSON: ${{ toJson(matrix.partition.suites) }}
        CASES_JSON: ${{ toJson(matrix.partition.cases) }}
        SHARD: ${{ matrix.partition.shard }}
        CI_TEST_LOG: ${{ runner.temp }}/regression-tests.log
      run: |
        # Serial JVM and one compiler for graphics; matrix jobs run in parallel.
        case "$SHARD" in
          graphics-*|system-host|core-b|system-rt-16|system-rt-32|system-rt-batch)
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            ;;
        esac
        SBT_FLAGS=$(bash scripts/ci_shard_tests.sh flags "$SHARD")
        export SBT_FLAGS
        python3 scripts/run_ci_partition.py

  dependency-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        submodules: recursive
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Upload dependency graph
      uses: scalacenter/sbt-dependency-submission@ab086b50c947c9774b70f39fc7f6e20ca2706c91

  regression-ok:
    if: always()
    needs: [driver, select, scala, scala-overflow, dependency-graph]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Aggregate selected regression
      env:
        DRIVER: ${{ needs.driver.result }}
        SELECT: ${{ needs.select.result }}
        SCALA: ${{ needs.scala.result }}
        OVERFLOW: ${{ needs.scala-overflow.result }}
        DEPENDENCIES: ${{ needs.dependency-graph.result }}
        SELECTED: ${{ needs.select.outputs.selected }}
        BATCH1: ${{ needs.select.outputs.batch1 }}
        BATCH2: ${{ needs.select.outputs.batch2 }}
      run: |
        [ "$DRIVER" = success ] && [ "$SELECT" = success ] && [ "$DEPENDENCIES" = success ] || exit 1
        [ -n "$BATCH1" ] && [ -n "$BATCH2" ] || exit 1
        if [ "$SELECTED" = NONE ]; then
          [ "$BATCH1" = '[]' ] && [ "$BATCH2" = '[]' ] && [ "$SCALA" = skipped ] && [ "$OVERFLOW" = skipped ]
        else
          [ "$BATCH1" != '[]' ] && [ "$SCALA" = success ] || exit 1
          if [ "$BATCH2" = '[]' ]; then [ "$OVERFLOW" = skipped ]; else [ "$OVERFLOW" = success ]; fi
        fi

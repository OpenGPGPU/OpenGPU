name: Scala CI

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: scala-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  checks:
    # Drafts need the same bounded feedback; readiness is enforced by ci-ok.
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      suites: ${{ steps.select.outputs.suites }}
      affected: ${{ steps.select.outputs.affected }}
      partitions: ${{ steps.partitions.outputs.partitions }}
    env:
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
        submodules: recursive
    - name: Run host script tests
      run: bash scripts/test_scripts.sh
    - name: Select PR unit regressions
      id: select
      run: |
        BASE=$(git merge-base origin/main HEAD)
        mapfile -t CHANGED < <(git diff --name-only "$BASE" HEAD)
        SELECTED=$(bash scripts/select_tests.sh "${CHANGED[@]}")
        SUITES=$(bash scripts/ci_shard_tests.sh pr-suites "$SELECTED")
        echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
        echo "suites=$SUITES" >> "$GITHUB_OUTPUT"
        AFFECTED=$(python3 scripts/changed_test_suites.py "${CHANGED[@]}")
        echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
        printf '%s' "$AFFECTED" > "$RUNNER_TEMP/affected.json"
        python3 scripts/ci_case_partitions.py candidates "$RUNNER_TEMP/affected.json" > "$RUNNER_TEMP/case-suites.txt"
        printf 'Required changed/matching test suites:\n\n`%s`\n' "$AFFECTED" >> "$GITHUB_STEP_SUMMARY"
        if [ "$SELECTED" = NONE ]; then
          echo 'Host checks only: no Scala/build/CI inputs changed.' >> "$GITHUB_STEP_SUMMARY"
        else
          [ -n "$SUITES" ] || { echo 'Code validation selected no test suites' >&2; exit 1; }
          printf 'Bounded PR suites (broad integration runs separately):\n\n`%s`\n' "$SUITES" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Set up simulation toolchain
      if: steps.select.outputs.selected != 'NONE'
      id: toolchain
      uses: ./.github/actions/setup-simulation
    - name: Cache incremental Scala compilation
      if: steps.select.outputs.selected != 'NONE'
      uses: actions/cache@v4
      with:
        path: |
          target/scala-2.13
          project/target
        key: sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-
    - name: Compile all sources and register affected cases
      if: steps.select.outputs.selected != 'NONE'
      run: |
        COMMANDS=('set Test / parallelExecution := false' 'Test / compile')
        if [ -s "$RUNNER_TEMP/case-suites.txt" ]; then
          CASE_SUITES=$(tr '\n' ' ' < "$RUNNER_TEMP/case-suites.txt")
          COMMANDS+=("Test / runMain opengpu.testutil.CiSuiteCases $RUNNER_TEMP/cases.tsv $CASE_SUITES")
        fi
        sbt -Dopengpu.productQualification=0 -Dopengpu.simJobs=2 "${COMMANDS[@]}"

    - name: Plan exact affected-test partitions
      id: partitions
      run: |
        touch "$RUNNER_TEMP/cases.tsv"
        BASE=$(git merge-base origin/main HEAD)
        PARTITIONS=$(python3 scripts/ci_case_partitions.py plan "$RUNNER_TEMP/affected.json" "$RUNNER_TEMP/cases.tsv" --base "$BASE")
        echo "partitions=$PARTITIONS" >> "$GITHUB_OUTPUT"
        printf 'Required partitions:\n\n`%s`\n' "$PARTITIONS" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    needs: [checks]
    if: needs.checks.outputs.selected != 'NONE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        submodules: recursive
    - name: Set up simulation toolchain
      id: toolchain
      uses: ./.github/actions/setup-simulation
    - name: Restore incremental Scala compilation
      uses: actions/cache/restore@v4
      with:
        path: |
          target/scala-2.13
          project/target
        key: sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-
    - name: Cache PR simulation models
      uses: actions/cache@v4
      with:
        path: target/chiselsim/cache
        key: simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-pr-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-pr-
    - name: Run selected unit regressions
      env:
        SUITES: ${{ needs.checks.outputs.suites }}
      run: |
        set -o pipefail
        [ -n "$SUITES" ] || exit 1
        rm -rf target/test-reports
        sbt -Dopengpu.productQualification=0 -Dopengpu.simJobs=2 \
          'set Test / parallelExecution := false' "testOnly $SUITES" 2>&1 | tee "$RUNNER_TEMP/pr-tests.log"
        python3 scripts/check_pr_test_results.py "$RUNNER_TEMP/pr-tests.log" --suites $SUITES >> "$GITHUB_STEP_SUMMARY"

  affected-tests:
    name: affected-tests (${{ matrix.partition.id }})
    needs: [checks]
    if: needs.checks.outputs.partitions != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        partition: ${{ fromJson(needs.checks.outputs.partitions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        submodules: recursive
    - name: Set up simulation toolchain
      id: toolchain
      uses: ./.github/actions/setup-simulation
    - name: Cache incremental Scala compilation
      uses: actions/cache@v4
      with:
        path: |
          target/scala-2.13
          project/target
        key: sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-
    - name: Restore affected simulation models
      id: models
      uses: actions/cache/restore@v4
      with:
        path: target/chiselsim/cache
        key: simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-affected-${{ matrix.partition.cache }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition.id }}
        restore-keys: |
          simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-affected-${{ matrix.partition.cache }}-
          simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-affected-${{ matrix.partition.suites[0] }}-
    - name: Run required partition
      # Leave time inside the 90-minute job limit to retain completed builds.
      timeout-minutes: 75
      env:
        SUITES_JSON: ${{ toJson(matrix.partition.suites) }}
        CASES_JSON: ${{ toJson(matrix.partition.cases) }}
        SBT_FLAGS: -Dopengpu.simJobs=1 -Dopengpu.simHierarchy=GpuComputeUnit,Fp32PrimitiveRasterEngine,Rgba8BlendFmaEngine -Dopengpu.simLowMem=1 -Dopengpu.simLowMemOpt=1
        CI_TEST_LOG: ${{ runner.temp }}/affected-tests.log
      run: python3 scripts/run_ci_partition.py
    - name: Remove incomplete model copies
      if: always()
      run: rm -f target/chiselsim/cache/*.tmp.*
    - name: Save compiled simulation models
      if: always() && steps.models.outputs.cache-primary-key != ''
      uses: actions/cache/save@v4
      with:
        path: target/chiselsim/cache
        key: ${{ steps.models.outputs.cache-primary-key }}

  # Never report a stale or partially successful run as a successful required check.
  ci-ok:
    if: always()
    needs: [checks, unit-tests, affected-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Recheck that this run tests the current PR head
      id: snapshot
      uses: actions/github-script@v7
      with:
        script: |
          core.setOutput('current', 'false');
          const { owner, repo } = context.repo;
          const number = context.payload.pull_request.number;
          const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
          if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
              pr.head.sha !== context.payload.pull_request.head.sha) {
            core.setFailed('This run no longer belongs to the current open, ready PR head targeting main.');
            return;
          }
          core.setOutput('current', 'true');
    - name: Aggregate job results
      env:
        SNAPSHOT_CURRENT: ${{ steps.snapshot.outputs.current }}
        CHECKS_RESULT: ${{ needs.checks.result }}
        SELECTED: ${{ needs.checks.outputs.selected }}
        UNIT_RESULT: ${{ needs.unit-tests.result }}
        AFFECTED: ${{ needs.checks.outputs.affected }}
        AFFECTED_RESULT: ${{ needs.affected-tests.result }}
        PARTITIONS: ${{ needs.checks.outputs.partitions }}
      run: bash scripts/check_ci_job_results.sh

name: Scala CI

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: scala-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  checks:
    # Drafts need the same bounded feedback; readiness is enforced by ci-ok.
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms1G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
        submodules: recursive
    - name: Run host script tests
      run: bash scripts/test_scripts.sh
    - name: Select PR unit regressions
      id: select
      run: |
        BASE=$(git merge-base origin/main HEAD)
        mapfile -t CHANGED < <(git diff --name-only "$BASE" HEAD)
        SELECTED=$(bash scripts/select_tests.sh "${CHANGED[@]}")
        SUITES=$(bash scripts/ci_shard_tests.sh pr-suites "$SELECTED")
        echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
        echo "suites=$SUITES" >> "$GITHUB_OUTPUT"
        if [ "$SELECTED" = NONE ]; then
          echo 'Host checks only: no Scala/build/CI inputs changed.' >> "$GITHUB_STEP_SUMMARY"
        else
          [ -n "$SUITES" ] || { echo 'Code validation selected no test suites' >&2; exit 1; }
          printf 'Bounded PR suites (broad integration runs separately):\n\n`%s`\n' "$SUITES" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Set up simulation toolchain
      if: steps.select.outputs.selected != 'NONE'
      id: toolchain
      uses: ./.github/actions/setup-simulation
    - name: Cache incremental Scala compilation
      if: steps.select.outputs.selected != 'NONE'
      uses: actions/cache@v4
      with:
        path: |
          target/scala-2.13
          project/target
        key: sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          sbt-build-v1-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/*.properties') }}-
    - name: Cache PR simulation models
      if: steps.select.outputs.selected != 'NONE'
      uses: actions/cache@v4
      with:
        path: target/chiselsim/cache
        key: simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-pr-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          simcache-v2-${{ steps.toolchain.outputs.verilator-key }}-pr-
    - name: Compile all sources and run selected unit regressions
      if: steps.select.outputs.selected != 'NONE'
      env:
        SUITES: ${{ steps.select.outputs.suites }}
      run: |
        set -o pipefail
        [ -n "$SUITES" ] || exit 1
        COMMANDS=('set Test / parallelExecution := false' 'Test / compile' "testOnly $SUITES")
        sbt -Dopengpu.productQualification=0 -Dopengpu.simJobs=2 "${COMMANDS[@]}" 2>&1 | tee "$RUNNER_TEMP/pr-tests.log"
        python3 scripts/check_pr_test_results.py "$RUNNER_TEMP/pr-tests.log" >> "$GITHUB_STEP_SUMMARY"

  # Never report a stale or partially successful run as a successful required check.
  ci-ok:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Recheck that this run tests the current PR head
      id: snapshot
      uses: actions/github-script@v7
      with:
        script: |
          core.setOutput('current', 'false');
          const { owner, repo } = context.repo;
          const number = context.payload.pull_request.number;
          const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
          if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
              pr.head.sha !== context.payload.pull_request.head.sha) {
            core.setFailed('This run no longer belongs to the current open, ready PR head targeting main.');
            return;
          }
          core.setOutput('current', 'true');
    - name: Aggregate job results
      env:
        SNAPSHOT_CURRENT: ${{ steps.snapshot.outputs.current }}
      run: |
        [ "$SNAPSHOT_CURRENT" = "true" ] || exit 1
        [ "${{ needs.checks.result }}" = success ]

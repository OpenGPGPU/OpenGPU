name: Simulation toolchain
description: Set up Java, sbt and the pinned Verilator toolchain.
outputs:
  verilator-key:
    description: Runner-compatible Verilator cache namespace.
    value: ${{ steps.verilator-key.outputs.key }}
runs:
  using: composite
  steps:
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Compute Verilator cache key
        id: verilator-key
        # ImageOS is injected into the runner's process environment but is not
        # part of the expression context, so read it from the shell. Keying on the
        # image family (ubuntu24/ubuntu26) means a runner image migration rebuilds
        # rather than reusing a binary linked against a different glibc.
        shell: bash
        run: echo "key=verilator-5.050-${ImageOS:-unknown}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
      - name: Cache Verilator
        id: verilator-cache
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: ${{ steps.verilator-key.outputs.key }}
      - name: Install Verilator (v5.050 from source) and espresso
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git perl python3 make autoconf g++ flex bison libfl-dev zlib1g-dev ccache help2man
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
          curl -sL https://github.com/chipsalliance/espresso/releases/download/v2.4/x86_64-linux-gnu-espresso -o /usr/local/bin/espresso
          chmod +x /usr/local/bin/espresso
          if [ "${{ steps.verilator-cache.outputs.cache-hit }}" = "true" ]; then
            /opt/verilator/bin/verilator --version
            exit 0
          fi
          sudo mkdir -p /opt/verilator
          sudo chown "$(id -u):$(id -g)" /opt/verilator
          git clone --depth 1 --branch v5.050 https://github.com/verilator/verilator /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          make install
          /opt/verilator/bin/verilator --version
      - name: Cache firtool
        id: firtool-cache
        uses: actions/cache@v4
        with:
          path: /opt/firtool
          key: firtool-1.158.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install firtool 1.158.0
        shell: bash
        # Chisel otherwise downloads llvm-firtool during the first test. One
        # missed Maven lookup then fails every case in the job.
        run: |
          set -euo pipefail
          version=1.158.0
          dest=/opt/firtool
          firtool_version() {
            if [ -x "$dest/bin/firtool" ]; then
              "$dest/bin/firtool" --version 2>&1 || true
            fi
          }
          case "$(firtool_version)" in
            *"$version"*)
              echo "firtool $version already installed"
              ;;
            *)
              sudo mkdir -p "$dest"
              sudo chown "$(id -u):$(id -g)" "$dest"
              tmp=$(mktemp -d)
              url="https://github.com/llvm/circt/releases/download/firtool-${version}/firrtl-bin-linux-x64.tar.gz"
              ok=0
              for attempt in 1 2 3 4 5; do
                if curl -fsSL "$url" -o "$tmp/firtool.tar.gz"; then
                  ok=1
                  break
                fi
                sleep $((attempt * 2))
              done
              [ "$ok" = 1 ]
              tar -xzf "$tmp/firtool.tar.gz" -C "$tmp"
              bin=$(find "$tmp" -type f -name firtool -print -quit)
              [ -n "$bin" ]
              mkdir -p "$dest/bin"
              cp "$bin" "$dest/bin/firtool"
              chmod +x "$dest/bin/firtool"
              case "$(firtool_version)" in
                *"$version"*) ;;
                *) echo "firtool version check failed: $(firtool_version)" >&2; exit 1 ;;
              esac
              ;;
          esac
          echo "$dest/bin" >> "$GITHUB_PATH"
          echo "CHISEL_FIRTOOL_PATH=$dest/bin/firtool" >> "$GITHUB_ENV"
      - name: Prefetch Scala compiler bridge
        # Zinc resolves the bridge outside the normal update graph (sbt/sbt#8783).
        # Preserve valid caches; repair and retry only this known bridge miss.
        shell: bash
        run: bash scripts/prefetch_scala_bridge.sh
